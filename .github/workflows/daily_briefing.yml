name: 한국 주식 일일 브리핑

on:
  schedule:
    # UTC 기준 (KST = UTC+9): 21:00 UTC = 06:00 KST, 09:00 UTC = 18:00 KST
    - cron: "0 9,21 * * *"   # 매일 오전 6시 · 오후 6시 (KST)

  workflow_dispatch:

jobs:
  run-briefing:
    runs-on: ubuntu-latest

    steps:
      - name: 코드 체크아웃
        uses: actions/checkout@v4

      - name: Python 설치
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 브리핑 실행
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
